<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/svg+xml" href="./notes.svg">
  <link rel="icon" type="image/png" href="./notes.png">
  <meta charset="UTF-8">
  <title>Simple.Notes</title>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js"></script>
  <style>
    :root {
      /* Color Palette */
      --primary: #4a90e2;
      --primary-dark: #2c6cd1;
      --primary-light: #e6f0ff;
      --primary-active: #dbe9ff;

      --footer: #f59e0b;
      --footer-hover: #d97706;

      --bg-body: #f0f4f8;
      --bg-surface: #ffffff;

      --text-main: #333333;
      --text-muted: #666666;

      /* Effects */
      --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.15);
      --radius: 10px;
      --transition: 0.3s ease;
    }

    /* --- Base Reset & Layout --- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 34px;
      font-size: 2rem;
      text-align: center;
      color: var(--text-main);
    }

    /* --- Main Editor (Textarea) --- */
    #editor {
      width: 90%;
      max-width: 1280px;
      height: calc(75vh - 74px);
      padding: 20px;
      margin-top: 20px;

      font-size: 16px;
      line-height: 1.6;
      background: var(--bg-surface);
      color: var(--text-main);

      border: 2px solid var(--primary);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      resize: vertical;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    #editor:focus {
      outline: none;
      border-color: var(--primary-dark);
      box-shadow: var(--shadow-md);
    }

    /* --- URL Display Box --- */
    #urlBox {
      width: 90%;
      max-width: 1280px;
      margin-top: 20px;
      padding: 15px 20px;

      display: flex;
      align-items: center;
      gap: 10px;

      background: var(--primary-light);
      border-left: 5px solid var(--primary);
      border-radius: 8px;

      font-family: monospace;
      color: var(--text-main);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #urlBox:hover {
      background: var(--primary-active);
      color: var(--primary-dark);
    }

    #urlBox .label {
      flex-shrink: 0;
      color: var(--text-muted);
    }

    /* Truncation logic */
    #shareUrl {
      color: var(--primary-dark);
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Footer --- */
    footer {
      width: 100%;
      margin-top: auto;
      padding: 24px 20px;

      text-align: center;
      font-size: 0.9em;
      line-height: 1.6;
    }

    footer a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--footer);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--footer-hover);
    }

    /* Unified SVG Styles */
    svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: currentColor;
      stroke: currentColor;
    }
  </style>
</head>

<body>

  <h1>Simple Notes</h1>

  <textarea id="editor" placeholder="Type your message here..."></textarea>

  <div id="urlBox">
    <svg>
      <use href="#icon-share"></use>
    </svg>
    <span class="label">URL ready to share:</span>
    <span id="shareUrl">...</span>
  </div>

  <footer>
    <a href="https://buymeacoffee.com/simple.notes" target="_blank" rel="noopener">
      <svg>
        <use href="#icon-coffee"></use>
      </svg>
      Buy me a coffee
    </a>
  </footer>

  <script>
    const editor = document.getElementById('editor');
    const shareUrl = document.getElementById('shareUrl');
    const urlBox = document.getElementById('urlBox');

    // Copy to clipboard on click
    urlBox.addEventListener('click', async () => {
      const textToCopy = shareUrl.textContent;

      try {
        await navigator.clipboard.writeText(textToCopy);

        // Optional visual feedback
        const originalText = shareUrl.textContent;
        shareUrl.textContent = 'Copied!';
        setTimeout(() => {
          shareUrl.textContent = originalText;
        }, 1200);
      } catch (err) {
        console.error('Copy failed:', err);
      }
    });

    // Get URL parameter
    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    // Load message from URL if present
    const hash = getQueryParam('data');
    if (hash) {
      try {
        const decompressed = LZString.decompressFromEncodedURIComponent(hash);
        if (decompressed !== null) editor.value = decompressed;
      } catch (e) {
        console.error("Failed to decompress:", e);
      }
    }

    // Update URL and share box
    function updateURL(text) {
      const compressed = LZString.compressToEncodedURIComponent(text);
      const newURL = `${window.location.origin}${window.location.pathname}?data=${compressed}`;
      history.replaceState(null, '', newURL);
      shareUrl.textContent = newURL;
    }

    // Initialize URL box
    updateURL(editor.value);

    // Update as user types
    editor.addEventListener('input', () => {
      updateURL(editor.value);
    });

    // Handle back/forward buttons
    window.addEventListener('popstate', () => {
      const hash = getQueryParam('data');
      if (hash) {
        const decompressed = LZString.decompressFromEncodedURIComponent(hash);
        editor.value = decompressed || '';
        updateURL(editor.value);
      }
    });
  </script>
</body>

</html>
